<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="食遇日记">
    <meta name="theme-color" content="#F5A623">
    <title>食遇日记</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>
    <div id="errorOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#FDF8F0;z-index:9999;padding:40px 20px;text-align:center;font-family:-apple-system,sans-serif">
      <div style="font-size:48px;margin-bottom:16px">😵</div>
      <h2 style="color:#2C2C2C;margin-bottom:8px">页面加载出错</h2>
      <p id="errorDetail" style="color:#888;font-size:14px;word-break:break-all"></p>
      <button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;background:#F5A623;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer">重新加载</button>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var overlay = document.getElementById('errorOverlay');
        var detail = document.getElementById('errorDetail');
        if (overlay && detail) {
          detail.textContent = msg + (err ? ' (' + err.message + ')' : '');
          overlay.style.display = 'block';
        }
      };
    </script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
